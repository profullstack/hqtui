name: Ruby PHP Perl Nim bindings
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What `nimble install hqtui` gets: the vendored engine must match ports/c,
  # ports/cpp and ports/bindings, `nimble test` must pass, and an installed copy
  # must build a program with no checkout or shared library around it.
  nim-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.0.0
        with:
          install: false
      - name: Install Nim
        run: mise install nim@2.2.12
      - name: Vendored engine matches its sources
        shell: bash
        run: |
          sh ports/nim/tools/vendor.sh
          changes=$(git status --porcelain --untracked-files=all -- ports/nim/src/hqtui/engine)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git --no-pager diff --stat -- ports/nim/src/hqtui/engine
            echo "::error::ports/nim/src/hqtui/engine is stale. Run sh ports/nim/tools/vendor.sh and commit the result."
            exit 1
          fi
      - name: nimble test
        working-directory: ports/nim
        run: mise exec nim@2.2.12 -- nimble test
      - name: nimble install, then build against the installed package
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/nimble-install"
          mkdir -p "$scratch/app"
          (cd ports/nim && mise exec nim@2.2.12 -- nimble install -y --nimbleDir:"$scratch/nimble")
          cat > "$scratch/app/hello.nim" <<'EOF'
          import std/strutils, hqtui
          let ui = newUI()
          ui.panel("Installed", proc(p: UI) = p.meter(0.5, %*{"label": "CPU"}))
          var scene = newScene(30, 4)
          scene.set(ui)
          let frame = scene.render()
          doAssert "Installed" in frame and "CPU" in frame, frame
          echo frame
          EOF
          cd "$scratch/app"
          mise exec nim@2.2.12 -- nim c -r --hints:off --nimblePath:"$scratch/nimble/pkgs2" hello.nim
  bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.0.0
        with:
          install: false
      - name: Install only binding test toolchains
        run: mise install ruby@4.0.6 conda:php@8.5.9 perl@5.44.0.0 cmake@4.4.3 python@3.12.13 nim@2.2.12
      - name: Install private Perl dependencies
        run: mise exec perl@5.44.0.0 -- cpanm --local-lib-contained "${{ runner.temp }}/hqtui-perl" --notest --mirror https://cpan.metacpan.org --mirror-only FFI::Platypus@2.12
      - name: Build optimized binding library and PHP adapter
        shell: bash
        run: |
          mise exec -- cmake -S ports/cpp -B ports/cpp/build-bindings -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=ON -DHQTUI_LTO=ON -DHQTUI_BUILD_BINDINGS=ON -DHQTUI_PHP_CONFIG="$(mise exec conda:php@8.5.9 -- which php-config)"
          mise exec -- cmake --build ports/cpp/build-bindings --target hqtui_bindings hqtui_php hqtui_bindings_test --parallel 3
          mise exec -- ctest --test-dir ports/cpp/build-bindings -R bindings_abi --output-on-failure
      - name: Compile Nim examples and API tests
        run: mise exec nim@2.2.12 -- sh ports/nim/tests/build.sh
      - name: Check APIs, 960 reference frames, real data and terminal cleanup
        shell: bash
        run: |
          extension=so
          if [ "$(uname -s)" = Darwin ]; then extension=dylib; fi
          export HQTUI_NATIVE_LIB="$PWD/ports/cpp/build-bindings/libhqtui_bindings.$extension"
          export PERL5LIB="${{ runner.temp }}/hqtui-perl/lib/perl5"
          mise exec -- python ports/bindings/tests/check.py
      - name: Widget galleries (C++, Ruby, PHP, Perl, Nim)
        shell: bash
        run: |
          extension=so
          if [ "$(uname -s)" = Darwin ]; then extension=dylib; fi
          export HQTUI_NATIVE_LIB="$PWD/ports/cpp/build-bindings/libhqtui_bindings.$extension"
          export PERL5LIB="${{ runner.temp }}/hqtui-perl/lib/perl5"
          mise exec -- cmake --build ports/cpp/build-bindings --target hqtui-widgets --parallel 3
          ./ports/cpp/build-bindings/hqtui-widgets >/dev/null
          ./ports/nim/build/widgets >/dev/null
          (cd ports/ruby && mise exec ruby@4.0.6 -- ruby examples/widgets.rb >/dev/null)
          php_adapter="$PWD/ports/cpp/build-bindings/hqtui_php.so"
          (cd ports/php && mise exec conda:php@8.5.9 -- php -d "extension=$php_adapter" examples/widgets.php >/dev/null)
          (cd ports/perl && mise exec perl@5.44.0.0 -- perl examples/widgets.pl >/dev/null)
      - name: Verify vanilla PHP FFI fallback without the native PHP adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-common
          export HQTUI_NATIVE_LIB="$PWD/ports/cpp/build-bindings/libhqtui_bindings.so"
          export HQTUI_BINDING_COMMANDS='{"php":["/usr/bin/php","-d","ffi.enable=true"]}'
          mise exec -- python ports/bindings/tests/check.py
