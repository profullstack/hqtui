name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # `typecheck` builds the library itself, because apps/demo and examples
      # resolve `@profullstack/hqtui` through its published `types`, which point
      # into dist. Running it before Build in a clean checkout — as CI does —
      # left them with no types to find.
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test packages/hqtui/test apps/demo/test apps/web/test
      - name: Build
        run: bun run build

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Test under Node
        run: node --test packages/hqtui/test/*.test.ts apps/demo/test/*.test.ts apps/web/test/*.test.ts

  # apps/web is the deployed artifact and the largest TypeScript surface in the
  # repo, but nothing built or typechecked it — a broken site reached Railway
  # before it reached CI. `next build` does both.
  site:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the library the site imports
        run: bun run build
      - name: Build site
        run: bun run --cwd apps/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run bench | tee benchmark.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark.txt
