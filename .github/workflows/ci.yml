name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native demos and terminal cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
      - name: Verify update-and-run launcher isolation and fresh revisions
        run: python apps/demo/scripts/test-updater.py
      - run: mise run test:rust
      - run: mise run test:go
      - run: mise run test:python
      - run: mise run test:zig
      - run: python apps/demo/scripts/check-native-commands.py
      - run: python apps/demo/scripts/check-native-data.py
      # The widget galleries behind hqtui.com/widgets. Each renders every
      # widget headlessly and exits non-zero on a blank screen, which is what
      # a renamed option looks like from the outside.
      - name: Widget galleries (Rust, Go, Python, Zig)
        run: |
          mise exec -- cargo run --quiet --example widgets --manifest-path ports/rust/Cargo.toml >/dev/null
          (cd ports/go && mise exec -- go run ./examples/widgets >/dev/null)
          (cd ports/python && mise exec -- python -m examples.widgets >/dev/null)
          (cd ports/zig && mise exec -- zig build run-widgets >/dev/null)

  python:
    name: Python examples and terminal cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test native Python library
        working-directory: ports/python
        run: python -m unittest discover -s tests -t .
      - name: Smoke-test documented headless example
        working-directory: ports/python
        run: python -m examples.screenshot

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # `typecheck` builds the library itself, because apps/demo and examples
      # resolve `@profullstack/hqtui` through its published `types`, which point
      # into dist. Running it before Build in a clean checkout — as CI does —
      # left them with no types to find.
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test packages/hqtui/test apps/demo/test apps/web/test
      - name: Build
        run: bun run build
      - name: Widget galleries (TypeScript and vanilla JavaScript)
        run: |
          bun examples/widgets/check.ts
          node examples/widgets/gallery.js >/dev/null
      # The committed catalog is generated. If it can drift from the galleries
      # then the site can show code that no longer compiles, which is the one
      # thing this whole arrangement exists to prevent.
      - name: The published widget catalog is current
        run: |
          bun examples/widgets/build-catalog.ts
          git diff --exit-code -- apps/web/content/widgets.json

  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Test under Node
        run: node --test packages/hqtui/test/*.test.ts apps/demo/test/*.test.ts apps/web/test/*.test.ts

  # apps/web is the deployed artifact and the largest TypeScript surface in the
  # repo, but nothing built or typechecked it — a broken site reached Railway
  # before it reached CI. `next build` does both.
  site:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the library the site imports
        run: bun run build
      - name: Build site
        run: bun run --cwd apps/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run bench | tee benchmark.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark.txt

  cobol:
    name: COBOL bridges to TypeScript and Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.3.0
      - name: Compile the COBOL program
        run: |
          printf 'FROM ubuntu:24.04\nRUN apt-get update -qq && apt-get install -y -qq gnucobol4 && rm -rf /var/lib/apt/lists/*\n' > /tmp/Dockerfile.cobol
          docker build -q -f /tmp/Dockerfile.cobol -t hqtui-cobol /tmp
          mkdir -p ports/cobol/build
          docker run --rm -v "$PWD/ports/cobol":/w -w /w hqtui-cobol cobc -x -free examples/widgets.cbl -o build/widgets
          docker run --rm -v "$PWD/ports/cobol":/w -w /w hqtui-cobol ./build/widgets > /tmp/records.txt
      # Both adapters read the same 80-column records. If they ever disagree,
      # the record layout has stopped being the interface.
      - name: Render the records through both bridges and compare
        run: |
          bun install --frozen-lockfile
          bun run build
          bun ports/cobol/adapter/render.ts < /tmp/records.txt > /tmp/typescript.txt
          mise exec -- cargo run --quiet --example cobol-bridge --manifest-path ports/rust/Cargo.toml < /tmp/records.txt > /tmp/rust.txt
          diff /tmp/typescript.txt /tmp/rust.txt
