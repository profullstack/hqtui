[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hqtui"
version = "0.1.12"
description = "High Quality Terminal UI. btop-grade dashboards with a one-import API, dark by default, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["tui", "terminal", "dashboard", "ansi", "braille", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Terminals",
]
# Zero dependencies, including for tests: the conformance suite reads its
# fixtures with the standard library's json module and runs under unittest.
dependencies = []

[project.scripts]
hqtui-demo-python = "hqtui_demo.__main__:main"

[project.urls]
Homepage = "https://hqtui.com"
Repository = "https://github.com/profullstack/hqtui"

[tool.hatch.build.targets.wheel]
packages = ["hqtui", "hqtui_demo"]
