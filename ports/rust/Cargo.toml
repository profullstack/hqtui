[package]
name = "hqtui"
version = "0.1.11"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "High Quality Terminal UI. btop-grade dashboards with a one-import API, dark by default, zero dependencies."
homepage = "https://hqtui.com"
repository = "https://github.com/profullstack/hqtui"
readme = "README.md"
keywords = ["tui", "terminal", "dashboard", "ansi", "braille"]
categories = ["command-line-interface"]

# The library has no runtime dependencies. The full dashboard example uses
# serde_json for telemetry and its shared TypeScript comparison fixtures.
[dependencies]

[dev-dependencies]
serde_json = "1"

[[example]]
name = "dashboard"
path = "demo/src/main.rs"

[[example]]
name = "dashboard-mini"
path = "examples/dashboard.rs"

[lib]
name = "hqtui"
path = "src/lib.rs"
