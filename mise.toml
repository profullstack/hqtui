# Reproducible runtime/build tools for the demos in this monorepo.
# Adding a tool here is not a claim that a native hqtui library exists for it.
[tools]
bun = "1.4.0"
python = "3.12.13"
go = "1.26.0"
rust = "1.97.1"
zig = "0.16.0"
cmake = "4.4.3"
ruby = "4.0.6"
"conda:php" = "8.5.9"
perl = "5.44.0.0"

[tasks."demo:ruby"]
description = "Update and run Ruby binding demo"
run = "sh apps/web/public/demo.sh --mise ruby"

[tasks."demo:php"]
description = "Update and run PHP binding demo"
run = "sh apps/web/public/demo.sh --mise php"

[tasks."demo:perl"]
description = "Update and run Perl binding demo"
run = "sh apps/web/public/demo.sh --mise perl"

[tasks."demo:cpp"]
description = "Update and run the native C++ ten-screen demo (requires C/C++ compiler)"
run = "sh apps/web/public/demo.sh --mise cpp"

[tasks."demo-local:cpp"]
description = "Build and run this checkout's C++ demo without updating"
run = ["cmake -S ports/cpp -B ports/cpp/build-demo -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF", "cmake --build ports/cpp/build-demo --target hqtui-demo-cpp --parallel 2", "ports/cpp/build-demo/hqtui-demo-cpp"]

[tasks."demo:typescript"]
description = "TypeScript reference demo (Bun)"
run = "sh apps/web/public/demo.sh --mise typescript"

[tasks."demo:python"]
description = "Native Python reference demo"
run = "sh apps/web/public/demo.sh --mise python"

[tasks."demo:go"]
description = "Native Go reference demo"
run = "sh apps/web/public/demo.sh --mise go"

[tasks."demo:rust"]
description = "Native Rust reference demo"
run = "sh apps/web/public/demo.sh --mise rust"

[tasks."demo:zig"]
description = "Native Zig reference demo"
run = "sh apps/web/public/demo.sh --mise zig"

[tasks."demo-local:typescript"]
description = "Run this checkout's TypeScript demo without updating"
run = "bun apps/demo/src/main.ts"

[tasks."demo-local:rust"]
description = "Run this checkout's Rust demo without updating"
run = "cargo run --manifest-path ports/rust/Cargo.toml --example dashboard --"

[tasks."demo-local:go"]
description = "Run this checkout's Go demo without updating"
dir = "{{config_root}}/ports/go"
run = "go run ./examples/dashboard"

[tasks."demo-local:python"]
description = "Run this checkout's Python demo without updating"
dir = "{{config_root}}/ports/python"
run = "python -m examples.dashboard"

[tasks."demo-local:zig"]
description = "Run this checkout's Zig demo without updating"
dir = "{{config_root}}/ports/zig"
run = "zig build run-dashboard --"

[tasks."test:python"]
description = "Python conformance and demo acceptance tests"
dir = "{{config_root}}/ports/python"
run = "python -m unittest discover -s tests -t ."

[tasks."test:go"]
description = "Go conformance and demo tests, including the race detector"
dir = "{{config_root}}/ports/go"
run = "go test -race ./..."

[tasks."test:rust"]
description = "Rust library and demo tests"
run = ["cargo test --manifest-path ports/rust/Cargo.toml --all-targets", "cargo test --manifest-path ports/rust/demo/Cargo.toml"]

[tasks."test:zig"]
description = "Zig conformance and demo tests"
dir = "{{config_root}}/ports/zig"
run = "zig build test test-demo"

[tasks."test:typescript"]
description = "TypeScript reference and site tests"
run = "bun test packages/hqtui/test apps/demo/test apps/web/test"

[tasks."test:c"]
description = "Experimental C core: build and conformance tests (requires CMake/C compiler)"
run = ["cmake -S ports/c -B ports/c/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON", "cmake --build ports/c/build --parallel", "ctest --test-dir ports/c/build --output-on-failure"]

[tasks."test:cpp"]
description = "Experimental C++ API and shared C core tests (requires CMake/C++ compiler)"
run = ["cmake -S ports/cpp -B ports/cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON", "cmake --build ports/cpp/build --parallel", "ctest --test-dir ports/cpp/build --output-on-failure"]

[tasks."bench:cpp"]
description = "Matched C/C++/TypeScript core benchmarks; not full-demo FPS"
run = ["cmake -S ports/cpp -B ports/cpp/build-release -DCMAKE_BUILD_TYPE=Release -DHQTUI_LTO=ON", "cmake --build ports/cpp/build-release --parallel", "bun apps/benchmark/src/compare-native-core.ts"]
